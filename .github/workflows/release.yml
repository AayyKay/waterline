name: Publish Waterline release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $project = [xml](Get-Content Waterline.csproj)
          $version = $project.Project.PropertyGroup.Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match project version $version" }
      - name: Run foundation tests
        run: dotnet run --project Waterline.Tests/Waterline.Tests.csproj --configuration Release
      - name: Run Windows application tests
        run: dotnet run --project Waterline.App.Tests/Waterline.App.Tests.csproj --configuration Release
      - name: Publish self-contained Windows app
        run: dotnet publish Waterline.csproj --configuration Release --runtime win-x64 --self-contained true --output publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
      - name: Build Windows installer
        shell: pwsh
        run: |
          $project = [xml](Get-Content Waterline.csproj)
          $version = $project.Project.PropertyGroup.Version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\Waterline.iss
      - name: Verify release candidate payload
        shell: pwsh
        run: |
          $project = [xml](Get-Content Waterline.csproj)
          $version = $project.Project.PropertyGroup.Version
          ./tools/Verify-ReleaseCandidate.ps1 -Version $version -PublishDirectory publish -InstallerPath "release/Waterline-Setup-$version.exe"
      - name: Create release checksums
        shell: pwsh
        run: |
          $project = [xml](Get-Content Waterline.csproj)
          $version = $project.Project.PropertyGroup.Version
          $installer = "release/Waterline-Setup-$version.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Waterline-Setup-$version.exe" | Set-Content -LiteralPath "release/Waterline-Setup-$version.exe.sha256" -Encoding ascii
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --title "Waterline $version" `
            --notes-file "docs/release-notes-$version.md" `
            "release/Waterline-Setup-$version.exe" `
            "release/Waterline-Setup-$version.exe.sha256"
